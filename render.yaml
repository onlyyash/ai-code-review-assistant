services:
  - type: web
    name: ai-code-reviewer-backend
    env: python
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # set the value in the Render dashboard, never in git
      - key: ALLOWED_ORIGINS
        sync: false
    autoDeploy: true
    pythonVersion: 3.10.12